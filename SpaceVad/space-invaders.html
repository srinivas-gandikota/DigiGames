<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            border: 4px solid #0f0;
            box-shadow: 0 0 20px #0f0, 0 0 40px #0f0, 0 0 60px #0f0;
        }

        #gameCanvas {
            display: block;
            background: linear-gradient(to bottom, #000 0%, #001 100%);
        }

        .ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            color: #0f0;
            font-size: 18px;
            text-shadow: 0 0 10px #0f0;
            pointer-events: none;
            z-index: 10;
        }

        .score-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .high-score {
            color: #ff0;
            font-size: 14px;
            text-shadow: 0 0 5px #ff0;
        }

        .start-screen,
        .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 20;
        }

        .game-over-screen {
            display: none;
        }

        .pause-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            z-index: 25;
        }

        .pause-screen h1 {
            color: #ff0;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ff0;
            animation: pulse 1.5s ease-in-out infinite;
        }

        h1 {
            color: #0f0;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #0f0, 0 0 40px #0f0;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                text-shadow: 0 0 20px #0f0, 0 0 40px #0f0;
            }

            50% {
                text-shadow: 0 0 30px #0f0, 0 0 60px #0f0, 0 0 80px #0f0;
            }
        }

        .btn {
            background: transparent;
            color: #0f0;
            border: 2px solid #0f0;
            padding: 15px 40px;
            font-size: 20px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
            text-transform: uppercase;
            box-shadow: 0 0 10px #0f0;
        }

        .btn:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 20px #0f0, 0 0 40px #0f0;
        }

        .instructions {
            color: #0f0;
            margin: 20px 0;
            text-align: center;
            line-height: 1.8;
            text-shadow: 0 0 5px #0f0;
        }

        .key {
            display: inline-block;
            padding: 5px 10px;
            border: 1px solid #0f0;
            border-radius: 3px;
            margin: 0 3px;
        }

        .lives-display {
            display: flex;
            gap: 5px;
        }

        .life-icon {
            width: 30px;
            height: 20px;
            background: #0f0;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        .wave-indicator {
            color: #ff0;
            text-shadow: 0 0 10px #ff0;
        }

        .mute-indicator {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: #0f0;
            font-size: 12px;
            text-shadow: 0 0 5px #0f0;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>

<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div class="ui-overlay">
            <div class="score-container">
                <div>SCORE: <span id="score">0</span></div>
                <div class="high-score">HIGH: <span id="highScore">0</span></div>
            </div>
            <div class="wave-indicator">WAVE: <span id="wave">1</span></div>
            <div class="lives-display" id="lives"></div>
        </div>

        <div class="mute-indicator" id="muteIndicator">🔊 SOUND ON</div>

        <div class="start-screen" id="startScreen">
            <h1>SPACE INVADERS</h1>
            <div class="instructions">
                <p>Use <span class="key">←</span> <span class="key">→</span> to move</p>
                <p>Press <span class="key">SPACE</span> to shoot</p>
                <p>Press <span class="key">P</span> or <span class="key">ESC</span> to pause</p>
                <p>Press <span class="key">M</span> to mute sounds</p>
                <p>Destroy all invaders before they reach you!</p>
            </div>
            <button class="btn" id="startBtn">START GAME</button>
        </div>

        <div class="pause-screen" id="pauseScreen">
            <h1>PAUSED</h1>
            <div class="instructions">
                <p>Press <span class="key">P</span> or <span class="key">ESC</span> to resume</p>
            </div>
        </div>

        <div class="game-over-screen" id="gameOverScreen">
            <h1 id="gameOverTitle">GAME OVER</h1>
            <p style="color: #0f0; font-size: 24px; margin: 20px;">
                FINAL SCORE: <span id="finalScore">0</span>
            </p>
            <div class="instructions" style="margin: 15px 0;">
                <p>Press <span class="key">P</span> to toggle pause</p>
                <p>Press <span class="key">M</span> to mute sounds</p>
            </div>
            <button class="btn" id="restartBtn">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game state
        let gameRunning = false;
        let gamePaused = false;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('spaceInvadersHighScore')) || 0;
        let wave = 1;
        let lives = 5;
        let soundEnabled = true;
        let animationId;

        // Audio context
        let audioCtx;

        // Player
        const player = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 50,
            width: 50,
            height: 30,
            speed: 7,
            color: '#0f0',
            bullets: [],
            cooldown: 0
        };

        // Invaders
        let invaders = [];
        let invaderBullets = [];
        let invaderDirection = 1;
        let invaderSpeed = 1;
        let invaderDropDistance = 30;

        // Particles for explosions
        let particles = [];

        // Stars background
        const stars = [];
        for (let i = 0; i < 100; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 1,
                speed: Math.random() * 0.5 + 0.1
            });
        }

        // Initialize audio
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Generate sound effects
        function playSound(type) {
            if (!soundEnabled || !audioCtx) return;

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            switch (type) {
                case 'shoot':
                    oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.1);
                    break;

                case 'explosion':
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
                    gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.3);
                    break;

                case 'invaderHit':
                    oscillator.type = 'square';
                    oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                    oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.15);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.15);
                    break;

                case 'gameOver':
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 1);
                    gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 1);
                    break;

                case 'pause':
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                    gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.1);
                    break;
            }
        }

        // Initialize invaders grid
        function createInvaders() {
            invaders = [];
            const rows = 4 + Math.min(wave - 1, 4);
            const cols = 8 + Math.min(wave - 1, 4);
            const startX = (canvas.width - (cols * 50)) / 2;
            const startY = 50 + Math.min(wave - 1, 3) * 10;

            for (let row = 0; row < Math.min(rows, 6); row++) {
                for (let col = 0; col < Math.min(cols, 12); col++) {
                    invaders.push({
                        x: startX + col * 50,
                        y: startY + row * 40,
                        width: 40,
                        height: 30,
                        row: row,
                        col: col,
                        type: row < 1 ? 2 : row < 3 ? 1 : 0,
                        alive: true
                    });
                }
            }
            invaderSpeed = 1 + (wave - 1) * 0.3;
            invaderDirection = 1;
        }

        // Draw player ship
        function drawPlayer() {
            ctx.fillStyle = player.color;

            // Main body
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.lineTo(player.x + player.width, player.y + player.height - 10);
            ctx.lineTo(player.x + 10, player.y + player.height - 10);
            ctx.lineTo(player.x + 10, player.y + player.height);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.closePath();
            ctx.fill();

            // Cannon
            ctx.fillRect(player.x + player.width / 2 - 3, player.y - 8, 6, 8);

            // Glow effect
            ctx.shadowColor = player.color;
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // Draw invaders
        function drawInvader(invader) {
            if (!invader.alive) return;

            ctx.fillStyle = invader.type === 2 ? '#f00' : invader.type === 1 ? '#ff0' : '#0ff';

            // Alien body
            const x = invader.x;
            const y = invader.y;
            const w = invader.width;
            const h = invader.height;

            // Main body
            ctx.fillRect(x + w * 0.2, y, w * 0.6, h * 0.6);
            ctx.fillRect(x, y + h * 0.3, w, h * 0.4);

            // Eyes
            ctx.fillStyle = '#000';
            ctx.fillRect(x + w * 0.3, y + h * 0.4, w * 0.1, h * 0.1);
            ctx.fillRect(x + w * 0.6, y + h * 0.4, w * 0.1, h * 0.1);

            // Legs
            ctx.fillStyle = invader.type === 2 ? '#f00' : invader.type === 1 ? '#ff0' : '#0ff';
            ctx.fillRect(x, y + h * 0.7, w * 0.2, h * 0.3);
            ctx.fillRect(x + w * 0.8, y + h * 0.7, w * 0.2, h * 0.3);

            // Glow
            ctx.shadowColor = ctx.fillStyle;
            ctx.shadowBlur = 10;
            ctx.fillRect(x + w * 0.2, y, w * 0.6, h * 0.6);
            ctx.shadowBlur = 0;
        }

        // Draw bullets
        function drawBullets() {
            // Player bullets
            ctx.fillStyle = '#0f0';
            ctx.shadowColor = '#0f0';
            ctx.shadowBlur = 10;
            player.bullets.forEach(bullet => {
                ctx.fillRect(bullet.x - 2, bullet.y, 4, 15);
            });
            ctx.shadowBlur = 0;

            // Invader bullets
            ctx.fillStyle = '#f00';
            ctx.shadowColor = '#f00';
            ctx.shadowBlur = 10;
            invaderBullets.forEach(bullet => {
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, 5, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.shadowBlur = 0;
        }

        // Draw stars
        function drawStars() {
            ctx.fillStyle = '#fff';
            stars.forEach(star => {
                ctx.globalAlpha = Math.random() * 0.5 + 0.5;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });
            ctx.globalAlpha = 1;
        }

        // Draw particles
        function drawParticles() {
            particles.forEach((p, i) => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });
            ctx.globalAlpha = 1;
        }

        // Draw pause screen
        function drawPauseScreen() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ff0';
            ctx.font = 'bold 60px Courier New';
            ctx.textAlign = 'center';
            ctx.shadowColor = '#ff0';
            ctx.shadowBlur = 20;
            ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2 - 30);
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#0f0';
            ctx.font = '20px Courier New';
            ctx.fillText('Press P or ESC to resume', canvas.width / 2, canvas.height / 2 + 30);
        }

        // Create explosion
        function createExplosion(x, y, color) {
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        // Update particles
        function updateParticles() {
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
            });
            particles = particles.filter(p => p.life > 0);
        }

        // Update stars
        function updateStars() {
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });
        }

        // Update player
        function updatePlayer(keys) {
            if (keys['ArrowLeft'] && player.x > 0) {
                player.x -= player.speed;
            }
            if (keys['ArrowRight'] && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }
            if (keys[' '] && player.cooldown <= 0) {
                player.bullets.push({
                    x: player.x + player.width / 2,
                    y: player.y
                });
                player.cooldown = 20;
                playSound('shoot');
            }
            if (player.cooldown > 0) player.cooldown--;
        }

        // Update player bullets
        function updatePlayerBullets() {
            player.bullets.forEach((bullet, index) => {
                bullet.y -= 10;
                if (bullet.y < 0) {
                    player.bullets.splice(index, 1);
                }
            });
        }

        // Update invaders
        function updateInvaders() {
            let hitEdge = false;
            let aliveCount = 0;

            invaders.forEach(invader => {
                if (invader.alive) {
                    aliveCount++;
                    invader.x += invaderSpeed * invaderDirection;
                    if (invader.x <= 10 || invader.x >= canvas.width - invader.width - 10) {
                        hitEdge = true;
                    }
                }
            });

            if (hitEdge) {
                invaderDirection *= -1;
                invaders.forEach(invader => {
                    invader.y += invaderDropDistance;
                });
            }

            // Check if invaders reached player
            invaders.forEach(invader => {
                if (invader.alive && invader.y >= player.y) {
                    gameOver(false);
                }
            });

            // Random invader shooting
            if (aliveCount > 0 && Math.random() < 0.02 + wave * 0.005) {
                const aliveInvaders = invaders.filter(i => i.alive);
                const shooter = aliveInvaders[Math.floor(Math.random() * aliveInvaders.length)];
                invaderBullets.push({
                    x: shooter.x + shooter.width / 2,
                    y: shooter.y + shooter.height
                });
            }

            // Check win condition
            if (aliveCount === 0) {
                nextWave();
            }
        }

        // Update invader bullets
        function updateInvaderBullets() {
            invaderBullets.forEach((bullet, index) => {
                bullet.y += 5;
                if (bullet.y > canvas.height) {
                    invaderBullets.splice(index, 1);
                }
            });
        }

        // Check collisions
        function checkCollisions() {
            // Player bullets hitting invaders
            player.bullets.forEach((bullet, bIndex) => {
                invaders.forEach(invader => {
                    if (invader.alive &&
                        bullet.x > invader.x &&
                        bullet.x < invader.x + invader.width &&
                        bullet.y > invader.y &&
                        bullet.y < invader.y + invader.height) {

                        invader.alive = false;
                        player.bullets.splice(bIndex, 1);
                        createExplosion(invader.x + invader.width / 2, invader.y + invader.height / 2,
                            invader.type === 2 ? '#f00' : invader.type === 1 ? '#ff0' : '#0ff');

                        score += (invader.type + 1) * 100;
                        playSound('invaderHit');
                        updateUI();
                    }
                });
            });

            // Invader bullets hitting player
            invaderBullets.forEach((bullet, index) => {
                if (bullet.x > player.x &&
                    bullet.x < player.x + player.width &&
                    bullet.y > player.y &&
                    bullet.y < player.y + player.height) {

                    invaderBullets.splice(index, 1);
                    createExplosion(player.x + player.width / 2, player.y + player.height / 2, '#0f0');
                    playSound('explosion');
                    lives--;
                    updateUI();

                    if (lives <= 0) {
                        gameOver(false);
                    }
                }
            });
        }

        // Update UI
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('highScore').textContent = highScore;
            document.getElementById('wave').textContent = wave;

            const livesContainer = document.getElementById('lives');
            livesContainer.innerHTML = '';
            for (let i = 0; i < lives; i++) {
                const lifeIcon = document.createElement('div');
                lifeIcon.className = 'life-icon';
                livesContainer.appendChild(lifeIcon);
            }
        }

        // Next wave
        function nextWave() {
            wave++;
            updateUI();
            createInvaders();
            invaderBullets = [];
        }

        // Toggle pause
        function togglePause() {
            gamePaused = !gamePaused;
            document.getElementById('pauseScreen').style.display = gamePaused ? 'flex' : 'none';
            playSound('pause');
        }
        function toggleLives() {
            lives += 10;
            updateUI();
        }

        // Toggle mute
        function toggleMute() {
            soundEnabled = !soundEnabled;
            const muteIndicator = document.getElementById('muteIndicator');
            muteIndicator.textContent = soundEnabled ? '🔊 SOUND ON' : '🔇 SOUND OFF';
            muteIndicator.style.color = soundEnabled ? '#0f0' : '#888';
        }

        // Game over
        function gameOver(victory) {
            gameRunning = false;
            cancelAnimationFrame(animationId);

            // Update high score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('spaceInvadersHighScore', highScore);
            }
            updateUI();

            document.getElementById('gameOverTitle').textContent = victory ? 'VICTORY!' : 'GAME OVER';
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverScreen').style.display = 'flex';

            playSound('gameOver');
        }

        // Main game loop
        function gameLoop() {
            if (!gameRunning) return;

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw pause screen if paused
            if (gamePaused) {
                drawPauseScreen();
                animationId = requestAnimationFrame(gameLoop);
                return;
            }

            // Update
            updateStars();
            updatePlayer(keys);
            updatePlayerBullets();
            updateInvaders();
            updateInvaderBullets();
            checkCollisions();
            updateParticles();

            // Draw
            drawStars();
            drawPlayer();
            invaders.forEach(drawInvader);
            drawBullets();
            drawParticles();

            animationId = requestAnimationFrame(gameLoop);
        }

        // Input handling
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;

            if (e.key === ' ' && !gameRunning) {
                e.preventDefault();
            }

            // Pause toggle
            if ((e.key === 'p' || e.key === 'P' || e.key === 'Escape') && gameRunning) {
                e.preventDefault();
                togglePause();
            }

            if ((e.key === 'l' || e.key === 'L') && gameRunning) {
                e.preventDefault();
                toggleLives();
            }

            // Mute toggle
            if (e.key === 'm' || e.key === 'M') {
                e.preventDefault();
                toggleMute();
            }
        });
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Start game
        function startGame() {
            initAudio();
            score = 0;
            wave = 1;
            lives = 10;
            player.x = canvas.width / 2 - 25;
            player.bullets = [];
            invaderBullets = [];
            particles = [];

            updateUI();
            createInvaders();

            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameOverScreen').style.display = 'none';
            document.getElementById('pauseScreen').style.display = 'none';

            gameRunning = true;
            gamePaused = false;
            gameLoop();
        }

        // Button handlers
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);

        // Initial UI setup
        updateUI();
        document.getElementById('muteIndicator').textContent = '🔊 SOUND ON';
    </script>
</body>

</html>
